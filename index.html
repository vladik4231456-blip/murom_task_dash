<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics of html and js</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Notes</h1>

    <div class="main_part">
        <!-- Левая карточка: Ввод заметки -->
        <div class="new_note">
            <h3 class="note_input_title">Note input</h3>
            <input placeholder="Enter your note..." type="text" class="new_note_input">
            <button type="button" class="new_note_button">Save note</button>
        </div>

        <!-- Правая карточка: Список заметок -->
        <div class="note_list_container">
            <h3 class="your_notes">Your notes:</h3>
            <!-- Контейнер для динамических заметок -->
            <div class="note_list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
